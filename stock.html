<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5fdf9;
            color: #222;
        }

        .container {
            max-width: 430px;
            margin: auto;
            padding: 25px 20px;
        }

        h1 {
            text-align: center;
            color: #16845b;
            margin-bottom: 25px;
        }

        .produit {
            background-color: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .produit h2 {
            margin: 0 0 10px;
            color: #16845b;
            font-size: 19px;
        }

        .produit p {
            margin: 7px 0;
        }

        .retour {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #16845b;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📦 Mon Stock</h1>

        <div class="produit">
            <h2>Moringa</h2>
            <p>Catégorie : Plantes</p>
            <p>Prix de vente : 3 500 FCFA</p>
            <p>Stock disponible : <strong>17</strong></p>
        </div>

        <div class="produit">
            <h2>Djeka</h2>
            <p>Catégorie : Feuilles</p>
            <p>Prix de vente : 1 500 FCFA</p>
            <p>Stock disponible : <strong>50</strong></p>
        </div>

        <div class="produit">
            <h2>Amoxicilline</h2>
            <p>Catégorie : Antibiotique</p>
            <p>Prix de vente : 800 FCFA</p>
            <p>Stock disponible : <strong>15</strong></p>
        </div>

        <a href="index.html" class="retour">← Retour à l'accueil</a>

    </div>

</body>
</html>
